# SonarQube Configuration
# Project key should match your SonarQube project

sonar.projectKey=github-repository-key
sonar.projectName=Automated Code Review
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/*Test.java,**/test/**,.git/**,.terraform/**,node_modules/**,.venv/**,venv/**

# Java settings
sonar.java.source=11
sonar.java.binaries=target/classes

# Coverage settings
sonar.coverage.exclusions=**/*Test.java,**/test/**

# Python settings
sonar.python.version=3.11

# Security settings
sonar.security.hotspots.reviewed=false

# Issue tracking
sonar.externalIssuesReportPaths=external-issues.json

# Analysis scope
sonar.pullrequest.branch=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
sonar.pullrequest.base=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
sonar.pullrequest.key=$CI_MERGE_REQUEST_IID
