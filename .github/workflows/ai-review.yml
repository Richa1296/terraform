name: AI-Powered Code Review

# Disabled — use pr-review.yml instead
on:
  workflow_dispatch:

jobs:
  ai-code-review:
    name: Intelligent Code Pattern Analysis
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Changed Files
        id: changed_files
        uses: tj-actions/changed-files@v40
        with:
          files: |
            **.java
            **.py
            **.tf

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Analysis Tools
        run: |
          python -m pip install --upgrade pip
          pip install ast-grep radon pylint

      - name: Analyze Code Patterns
        if: steps.changed_files.outputs.all_changed_files != ''
        id: analysis
        run: |
          echo "Analyzing changed files for code patterns and issues..."
          
          # Create analysis report
          python3 << 'EOF'
          import json
          import os
          from pathlib import Path
          
          findings = {
              "patterns": [],
              "best_practices": [],
              "warnings": [],
              "suggestions": []
          }
          
          # Analyze for common anti-patterns
          for file_path in """${{ steps.changed_files.outputs.all_changed_files }}""".split():
              if not os.path.exists(file_path):
                  continue
                  
              with open(file_path, 'r', errors='ignore') as f:
                  content = f.read()
                  lines = content.split('\n')
              
              # Check for missing error handling
              if file_path.endswith('.py'):
                  for i, line in enumerate(lines, 1):
                      if 'except:' in line or 'except Exception' in line:
                          if 'pass' in lines[i] if i < len(lines) else False:
                              findings["warnings"].append({
                                  "file": file_path,
                                  "line": i,
                                  "issue": "Bare except with pass - consider specific exception handling",
                                  "severity": "warning"
                              })
              
              # Check for hardcoded credentials
              if any(keyword in content for keyword in ['password=', 'api_key=', 'secret=', 'token=']):
                  findings["warnings"].append({
                      "file": file_path,
                      "issue": "Potential hardcoded credentials detected",
                      "severity": "critical"
                  })
              
              # Check for missing docstrings/comments
              if file_path.endswith('.py') and len(content) > 500:
                  if content.count('"""') < 2 and content.count("'''") < 2:
                      findings["suggestions"].append({
                          "file": file_path,
                          "issue": "Large module without docstring - add module-level documentation",
                          "severity": "info"
                      })
              
              # Check for N+1 query patterns (for Java/Python)
              if 'for' in content and any(query_term in content for query_term in ['.query(', '.execute(', 'SELECT', 'db.', '.find(']):
                  findings["patterns"].append({
                      "file": file_path,
                      "issue": "Potential N+1 query pattern - consider batch operations",
                      "severity": "warning"
                  })
          
          print(json.dumps(findings, indent=2))
          with open('code-analysis.json', 'w') as f:
              json.dump(findings, f, indent=2)
          EOF
        continue-on-error: true

      - name: Check Complexity (Python)
        if: contains(steps.changed_files.outputs.all_changed_files, '.py')
        run: |
          python3 << 'EOF'
          import os
          from radon.metrics import mi_visit
          from radon.complexity import cc_visit
          
          print("## Code Complexity Analysis")
          
          for file_path in """${{ steps.changed_files.outputs.all_changed_files }}""".split():
              if file_path.endswith('.py') and os.path.exists(file_path):
                  try:
                      with open(file_path, 'r') as f:
                          code = f.read()
                      
                      # Check maintainability index
                      mi = mi_visit(code, True)
                      if mi < 20:
                          print(f"⚠️  {file_path}: Low maintainability ({mi:.1f})")
                      
                      # Check cyclomatic complexity
                      cc = cc_visit(code)
                      for func in cc:
                          if func.complexity > 10:
                              print(f"⚠️  {file_path}::{func.name}: High complexity ({func.complexity})")
                  except:
                      pass
          EOF
        continue-on-error: true

      - name: Generate AI Review Comment
        if: steps.changed_files.outputs.all_changed_files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let comment = `## 🤖 AI-Powered Code Review\n\n`;
            
            // Try to read analysis results
            let analysis = {};
            if (fs.existsSync('code-analysis.json')) {
              try {
                analysis = JSON.parse(fs.readFileSync('code-analysis.json', 'utf8'));
              } catch (e) {
                console.log('Could not parse analysis file');
              }
            }
            
            // Build comment from analysis
            if (analysis.warnings && analysis.warnings.length > 0) {
              comment += `### ⚠️ Warnings\n`;
              analysis.warnings.slice(0, 5).forEach(w => {
                comment += `- **${w.file}${w.line ? `:${w.line}` : ''}**: ${w.issue}\n`;
              });
              comment += `\n`;
            }
            
            if (analysis.patterns && analysis.patterns.length > 0) {
              comment += `### 🔍 Pattern Issues\n`;
              analysis.patterns.slice(0, 3).forEach(p => {
                comment += `- **${p.file}**: ${p.issue}\n`;
              });
              comment += `\n`;
            }
            
            if (analysis.suggestions && analysis.suggestions.length > 0) {
              comment += `### 💡 Suggestions\n`;
              analysis.suggestions.slice(0, 3).forEach(s => {
                comment += `- **${s.file}**: ${s.issue}\n`;
              });
              comment += `\n`;
            }
            
            // Add best practices section
            comment += `### ✅ Best Practices Checked\n`;
            comment += `- Error handling coverage\n`;
            comment += `- Credential security (no hardcoded secrets)\n`;
            comment += `- Code complexity metrics\n`;
            comment += `- Documentation completeness\n`;
            comment += `- N+1 query detection\n`;
            comment += `\n`;
            
            comment += `> **Note**: This is automated analysis. Please also review for logical errors and business logic correctness.\n`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            }).catch(err => console.log('Could not post comment'));
        continue-on-error: true

  copilot-review:
    name: GitHub Copilot Code Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false && vars.COPILOT_ENABLED == 'true'
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copilot PR Review
        uses: coderabbitai/ai-pr-reviewer@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          review_comment_lgtm: false
          language: en-US
        continue-on-error: true
