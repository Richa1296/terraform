name: Advanced Security Scanning

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 2 * * *'

jobs:
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Upload Trivy FS Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-fs'
        continue-on-error: true

  trivy-config:
    name: Trivy Configuration Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy Config Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Upload Trivy Config Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-config-results.sarif'
          category: 'trivy-config'
        continue-on-error: true

  owasp-dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'GitHub Repo'
          path: '.'
          format: 'JSON'
          args: >
            --enableExperimental
            --enableRetired
            --enableVulnerability
        continue-on-error: true

      - name: Upload Dependency-Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/dependency-check-report.json
          if-no-files-found: ignore

  hadolint:
    name: Hadolint Dockerfile Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3009
          failure-threshold: warning
        continue-on-error: true

  semgrep:
    name: Semgrep Code Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/cwe-top-25
          generateSarif: true
          generateSarifSeverity: critical,error,warning
        continue-on-error: true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v2
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: 'semgrep.sarif'
          category: 'semgrep'
        continue-on-error: true

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['java', 'python']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        continue-on-error: true

  snyk:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Snyk Test
        uses: snyk/actions/setup@master
        continue-on-error: true

      - name: Authenticate and Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "${{ secrets.SNYK_TOKEN }}" ]; then
            snyk auth ${{ secrets.SNYK_TOKEN }}
            snyk test --json > snyk-report.json || true
            echo "::group::Snyk Findings"
            cat snyk-report.json | jq '.runs[0].results | length' || echo "No results"
            echo "::endgroup::"
          else
            echo "Snyk token not configured. Skipping Snyk scan."
          fi
        continue-on-error: true

      - name: Upload Snyk Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json
          if-no-files-found: ignore

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [trivy-fs, trivy-config, owasp-dependency-check, hadolint, semgrep, codeql]
    steps:
      - name: Generate Security Report
        run: |
          echo "## Security Scanning Complete"
          echo ""
          echo "### Scans Performed:"
          echo "- Trivy Filesystem Scan (dependencies, vulnerabilities)"
          echo "- Trivy Configuration Scan (misconfigurations)"
          echo "- OWASP Dependency-Check (known vulnerabilities)"
          echo "- Hadolint (Dockerfile best practices)"
          echo "- Semgrep (code patterns and OWASP top 10)"
          echo "- CodeQL (Java and Python analysis)"
          echo "- Snyk (if configured)"
          echo ""
          echo "### Review Results:"
          echo "1. Check the 'Security' tab in GitHub for findings"
          echo "2. Review SARIF reports uploaded by scanning tools"
          echo "3. Address critical and high-severity issues before merging"
