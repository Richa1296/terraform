# Simple PR review — one check, one summary, team-lead style
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Team Lead Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **.py
            **.java
            **.tf
            **.tfvars
            requirements.txt
            pom.xml

      - name: Set up Python
        if: contains(steps.changes.outputs.all_changed_files, '.py') || contains(steps.changes.outputs.all_changed_files, 'requirements.txt')
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python tools
        if: contains(steps.changes.outputs.all_changed_files, '.py') || contains(steps.changes.outputs.all_changed_files, 'requirements.txt')
        run: pip install --quiet flake8 bandit pip-audit

      - name: Set up Terraform
        if: contains(steps.changes.outputs.all_changed_files, '.tf')
        uses: hashicorp/setup-terraform@v3

      - name: Run review checks
        id: checks
        continue-on-error: true
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.all_changed_files }}
        run: python3 pr-review-system/scripts/run_pr_review.py || true

      - name: Post summary to PR
        if: always()
        uses: actions/github-script@v7
        env:
          REVIEW_JSON: ${{ steps.checks.outputs.review_json }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr-review-bot -->';
            let review;
            try {
              review = JSON.parse(process.env.REVIEW_JSON || '{}');
            } catch (e) {
              review = { verdict: 'error', areas: [], must_fix: [], should_fix: [], suggestions: [], blocked: false };
            }

            const icon = (s) => s === 'pass' ? '✅' : s === 'warn' ? '⚠️' : s === 'fail' ? '🛑' : '—';
            const verdictLine = review.verdict === 'pass'
              ? '**✅ Ready for human review** — no blocking issues found.'
              : review.verdict === 'warn'
              ? '**⚠️ Please fix recommended items** — you can merge after human approval if policy allows.'
              : '**🛑 Fix required before merge** — blocking issues below.';

            let body = `${marker}\n## PR Review Summary\n\n${verdictLine}\n\n`;
            body += `| What we check (team-lead view) | Status | Notes |\n`;
            body += `|--------------------------------|--------|-------|\n`;
            for (const area of (review.areas || [])) {
              body += `| ${area.label} | ${icon(area.status)} | ${area.notes || '—'} |\n`;
            }

            const section = (title, items) => {
              if (!items || items.length === 0) return '';
              let s = `\n### ${title}\n`;
              for (const item of items) {
                s += `- **${item.file}${item.line ? ':' + item.line : ''}** — ${item.message}\n`;
                if (item.hint) s += `  - *Fix:* ${item.hint}\n`;
              }
              return s;
            };

            body += section('🛑 Must fix (blocks merge)', review.must_fix);
            body += section('⚠️ Should fix', review.should_fix);
            body += section('💡 Suggestions', review.suggestions);

            body += `\n---\n`;
            body += `*Automated review helper — mirrors what a team lead checks first. Human review still required.*\n`;
            body += `*Details: [What we check](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${context.repo.default_branch}/pr-review-system/docs/TEAM_LEAD_REVIEW.md)*\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Job summary (Actions UI)
        if: always()
        run: |
          if [ -f review-summary.md ]; then
            cat review-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if blocking issues
        if: steps.checks.outputs.blocked == 'true'
        run: |
          echo "Blocking issues found — see PR comment and job summary."
          exit 1
