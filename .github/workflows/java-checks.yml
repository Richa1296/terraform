name: Java Code Quality Checks

on:
  pull_request:
    paths:
      - '**.java'
      - 'pom.xml'
      - 'build.gradle'
      - '.github/workflows/java-checks.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - '**.java'
      - 'pom.xml'
      - 'build.gradle'

jobs:
  checkstyle:
    name: Checkstyle Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
          cache: maven

      - name: Run Checkstyle
        run: |
          if [ -f "pom.xml" ]; then
            mvn checkstyle:check -DskipTests -q
          elif [ -f "build.gradle" ]; then
            ./gradlew checkstyleMain --no-daemon -q
          else
            echo "No Maven or Gradle build file found"
          fi
        continue-on-error: true

  spotbugs:
    name: SpotBugs Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
          cache: maven

      - name: Run SpotBugs
        run: |
          if [ -f "pom.xml" ]; then
            mvn clean compile spotbugs:check -DskipTests -q || true
            if [ -f "target/spotbugsXml.xml" ]; then
              echo "::group::SpotBugs Findings"
              cat target/spotbugsXml.xml | grep -o '<BugInstance.*</BugInstance>' || echo "No bugs found"
              echo "::endgroup::"
            fi
          fi
        continue-on-error: true

  pmd:
    name: PMD Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'

      - name: Run PMD
        run: |
          wget https://github.com/pmd/pmd/releases/download/pmd_releases%2F6.55.0/pmd-bin-6.55.0.zip
          unzip -q pmd-bin-6.55.0.zip
          ./pmd-bin-6.55.0/bin/pmd check -d . -R rulesets/java/quickstart.xml --format json > pmd-report.json || true
          if [ -s pmd-report.json ]; then
            echo "::group::PMD Violations Found"
            cat pmd-report.json | jq '.violations | length'
            echo "::endgroup::"
          fi
        continue-on-error: true

  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
          cache: maven

      - name: Run OWASP Dependency-Check
        run: |
          if [ -f "pom.xml" ]; then
            mvn org.owasp:dependency-check-maven:check -DskipTests -q || true
          fi
        continue-on-error: true

      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore
