name: Secrets and Credentials Scanning

# Disabled — use pr-review.yml instead
on:
  workflow_dispatch:

jobs:
  truffelhog:
    name: TruffleHog Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

  gitleaks:
    name: GitLeaks Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  credential-detector:
    name: Credential and Configuration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect AWS Credentials
        run: |
          echo "Scanning for AWS credentials patterns..."
          if grep -r "AKIA" . --include="*.py" --include="*.java" --include="*.tf" --include="*.json" --include="*.yaml" --include="*.yml" 2>/dev/null; then
            echo "::warning::Potential AWS access key found in code"
          fi
        continue-on-error: true

      - name: Detect Database Credentials
        run: |
          echo "Scanning for database connection strings..."
          if grep -rE "(postgres|mysql|mongodb|cassandra)://.*:.*@" . --include="*.py" --include="*.java" --include="*.tf" --include="*.json" --include="*.yaml" --include="*.yml" 2>/dev/null; then
            echo "::warning::Potential database credentials found in code"
          fi
        continue-on-error: true

      - name: Detect API Keys
        run: |
          echo "Scanning for common API key patterns..."
          if grep -rE "(api_key|apiKey|API_KEY|secret|SECRET|password|PASSWORD)\s*[=:]\s*['\"]?[a-zA-Z0-9]{20,}" . \
            --include="*.py" --include="*.java" --include="*.tf" --include="*.json" --include="*.yaml" --include="*.yml" 2>/dev/null; then
            echo "::warning::Potential API keys or secrets found in code"
          fi
        continue-on-error: true

      - name: Check for Private Keys
        run: |
          echo "Scanning for private keys..."
          if grep -r "PRIVATE KEY" . --include="*.pem" --include="*.key" --include="*.txt" --include="*.py" 2>/dev/null; then
            echo "::error::Private key found in repository!"
            exit 1
          fi
        continue-on-error: true

  env-file-check:
    name: Environment File Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for .env files
        run: |
          echo "Scanning for environment files that shouldn't be committed..."
          if find . -name ".env" -o -name ".env.local" -o -name ".env.*.local" 2>/dev/null | grep -v "example\|sample\|template"; then
            echo "::warning::Environment files found - ensure they are in .gitignore"
          fi
        continue-on-error: true

      - name: Check for configuration files with secrets
        run: |
          echo "Scanning for common config files..."
          if find . -name "config.properties" -o -name "application.properties" -o -name "settings.ini" 2>/dev/null | grep -v "example\|sample\|template"; then
            echo "::notice::Configuration files found - verify no secrets are hardcoded"
          fi
        continue-on-error: true

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Audit Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          if [ -f requirements.txt ]; then
            pip-audit --desc -r requirements.txt || true
          fi
        continue-on-error: true

      - name: Audit Maven Dependencies
        if: hashFiles('pom.xml') != ''
        run: |
          if [ -f pom.xml ]; then
            mvn dependency-check:check -q || true
          fi
        continue-on-error: true

  report-findings:
    name: Report Security Findings
    runs-on: ubuntu-latest
    if: always()
    needs: [truffelhog, gitleaks, credential-detector, env-file-check, dependency-audit]
    steps:
      - name: Summary
        run: |
          echo "## Security Scan Summary"
          echo ""
          echo "Scans completed:"
          echo "- TruffleHog (verified secrets)"
          echo "- GitLeaks (unverified secrets)"
          echo "- Credential patterns (AWS, DB, API keys)"
          echo "- Private key detection"
          echo "- Environment file detection"
          echo "- Dependency vulnerability audit"
          echo ""
          echo "Review the logs above for any warnings or errors."
        continue-on-error: true
