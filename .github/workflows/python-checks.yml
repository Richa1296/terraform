name: Python Code Quality Checks

on:
  pull_request:
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - '.github/workflows/python-checks.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'setup.py'
      - 'pyproject.toml'

jobs:
  pylint:
    name: Pylint Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Pylint
        run: |
          find . -name "*.py" -not -path "./.venv/*" -not -path "./venv/*" -not -path "./.git/*" | xargs pylint --exit-zero --output-format=json > pylint-report.json || true
          cat pylint-report.json | jq 'length' || echo "No issues"
        continue-on-error: true

  flake8:
    name: Flake8 Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-docstrings flake8-bugbear

      - name: Run Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exit-zero
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]

      - name: Run Bandit
        run: |
          bandit -r . -f json -o bandit-report.json --exit-zero || true
          if [ -s bandit-report.json ]; then
            echo "::group::Bandit Security Issues Found"
            cat bandit-report.json | jq '.results | length'
            echo "::endgroup::"
          fi
        continue-on-error: true

      - name: Upload Bandit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore

  safety:
    name: Dependency Safety Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Safety
        run: |
          python -m pip install --upgrade pip
          pip install safety

      - name: Run Safety Check
        run: |
          if [ -f requirements.txt ]; then
            safety check --file requirements.txt --json > safety-report.json --exit-code 0 || true
            if [ -s safety-report.json ]; then
              echo "::group::Dependency Vulnerabilities Found"
              cat safety-report.json | jq 'length'
              echo "::endgroup::"
            fi
          fi
        continue-on-error: true

      - name: Upload Safety Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-report
          path: safety-report.json
          if-no-files-found: ignore

  black:
    name: Black Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Black
        run: |
          python -m pip install --upgrade pip
          pip install black

      - name: Run Black Check
        run: |
          black --check . --diff --exit-zero || true
        continue-on-error: true
