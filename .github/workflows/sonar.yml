name: SonarQube Code Quality Analysis

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
      - develop

jobs:
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'

      - name: Cache SonarQube packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run SonarQube Scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -n "${{ secrets.SONAR_TOKEN }}" ] && [ -n "${{ secrets.SONAR_HOST_URL }}" ]; then
            if [ -f "pom.xml" ]; then
              mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
                -Dsonar.projectKey=${{ github.repository }} \
                -Dsonar.sources=. \
                -Dsonar.exclusions=**/*Test.java,**/test/**,**/.git/** \
                -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
                -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            elif [ -f "build.gradle" ]; then
              echo "Gradle SonarQube scanning requires additional setup"
              echo "Please ensure org.sonarqube plugin is configured in build.gradle"
              ./gradlew sonarqube \
                -Dsonar.projectKey=${{ github.repository }} \
                -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
                -Dsonar.login=${{ secrets.SONAR_TOKEN }} || true
            else
              echo "No Maven or Gradle build file found"
              echo "SonarQube analysis will use default configuration"
            fi
          else
            echo "Skipping SonarQube scan - credentials not configured"
            echo "To enable SonarQube scanning:"
            echo "1. Set SONAR_TOKEN secret with your SonarQube token"
            echo "2. Set SONAR_HOST_URL secret with your SonarQube instance URL"
          fi
        continue-on-error: true

      - name: Comment PR with SonarQube Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const sonarUrl = '${{ secrets.SONAR_HOST_URL }}';
            const projectKey = '${{ github.repository }}';
            if (sonarUrl && projectKey) {
              const comment = `## SonarQube Analysis
              
              Link to analysis: [View on SonarQube](${sonarUrl}/dashboard?id=${projectKey.replace('/', '%2F')})
              
              This PR will be analyzed by SonarQube. Check the dashboard for detailed metrics.`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              }).catch(err => console.log('Comment creation skipped or failed'));
            }
        continue-on-error: true
